name: KCH Bites CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install backend dependencies
      - name: Install Backend
        run: |
          cd backend
          npm install

      # 4. Run backend tests
      - name: Run Backend Tests
        run: |
          cd backend
          npm test

      # 5. Install frontend dependencies
      - name: Install Frontend
        run: |
          cd frontend\"KCH Bites"
          npm install

      # 6. Build frontend
      - name: Build Frontend
        run: |
          cd frontend\"KCH Bites"
          npm run build