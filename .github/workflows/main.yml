name: KCH Bites CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # Backend setup (safe)
    - name: Setup Backend
      run: |
        if [ -f backend/package.json ]; then
          cd backend
          npm install
        else
          echo "No backend yet"
        fi

    # Frontend setup (safe)
    - name: Setup Frontend
      run: |
        if [ -f frontend/package.json ]; then
          cd frontend
          npm install
        else
          echo "No frontend yet"
        fi

    # Dummy success step
    - name: Pipeline Status
      run: echo "CI Pipeline pre-setup completed successfully"
