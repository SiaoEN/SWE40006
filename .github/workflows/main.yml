name: KCH Bites CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (IMPORTANT: match Vite requirement)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install backend dependencies
      - name: Install Backend
        run: |
          cd backend
          npm install

      # 4. Run backend tests (with DB secret support)
      - name: Run Backend Tests
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cd backend
          npm test -- --coverage

      - name: Check MongoDB Env
        run: echo "MONGODB_URI is set? ${{ secrets.MONGODB_URI != '' }}"

      # 5. Upload backend coverage report
      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/coverage

      # 6. Install frontend dependencies
      - name: Install Frontend
        run: |
          cd "frontend/KCH Bites"
          npm install

      # 7. Run frontend tests
      - name: Run Frontend Tests
        run: |
          cd "frontend/KCH Bites"
          npm test -- --coverage

      # 8. Upload frontend coverage report
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: "frontend/KCH Bites/coverage"

      # 9. Build frontend (only if tests pass)
      - name: Build Frontend
        run: |
          cd "frontend/KCH Bites"
          npm run build