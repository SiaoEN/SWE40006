services:
  - type: web
    name: swe40006-frontend
    runtime: static
    rootDir: "frontend/KCH Bites"
    buildCommand: npm install --legacy-peer-deps --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: swe40006-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_URI_FALLBACK
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: KCHBites
      - key: MONGODB_DBNAME
        value: KCHBites